<div class="modal fade" id="gradeModal" tabindex="-1" aria-labelledby="gradeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-center" id="gradeModalLabel">
          <span>Détails des notes pour {{ grade.studentName }}</span>
          <span *ngIf="subject?.name"> - {{subject?.name}}</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-3" *ngFor="let key of ['oral', 'ecrit', 'pratique', 'savoirEtre']">
            <div class="form-group">
              <label class="form-label text-capitalize">{{ key }}</label>
              <div class="input-group">
                <input
                  type="number"
                  class="form-control"
                  [(ngModel)]="subGrades[key]"
                  [min]=0
                  [max]=maxValues[key]
                >
                <span class="input-group-text">{{ maxValues[key] }}</span>
              </div>
            </div>
          </div>
        </div>
        <hr>
        <div class="text-end">
          <strong>Total : {{ total }} / {{ grade.outOf }}</strong>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary" (click)="save()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>
