

  <app-header></app-header>
<div class="hero-container">
  <div class="container">
    <div class="row">
      <div class="col-md-5 mx-auto">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="d-flex flex-column justify-content-between">
            <div class="card">
              <div class="mx-auto pt-2" routerLink="/home">
                <img src="favicon.ico" style="height: 50px;" class="img-fluid" alt="Logo">
              </div>
              <div class="card-body p-4">
                <div class="mb-2">
                  <h2 class="mb-2">Welcome</h2>
                  <p class="mb-0">Please enter your details to sign in</p>
                </div>

                <div class="mb-2">
                  <label class="form-label">Email Address</label>
                  <div>
                    <div class="input-icon mb-2 position-relative">
                      <span class="input-icon-addon">
                        <i class="ti ti-mail"></i>
                      </span>
                      <input type="email" formControlName="email" class="form-control" placeholder="Enter your email">
                    </div>
                    <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                      class="text-danger">
                      Valid email is required.
                    </small>
                  </div>
                  <div>
                    <label class="form-label">Password</label>
                    <div class="pass-group">
                      <input [type]="passwordVisible ? 'text' : 'password'" formControlName="password"
                        class="pass-input form-control" placeholder="Enter your password">
                      <span class="ti toggle-password" [ngClass]="passwordVisible ? 'ti-eye' : 'ti-eye-off'"
                        (click)="togglePasswordVisibility()"></span>
                    </div>
                    <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                      class="text-danger">
                      Password must be at least 6 characters.
                    </small>
                  </div>
                </div>



                <div class="form-wrap form-wrap-checkbox mb-3 d-flex align-items-center justify-content-between">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label ms-1">Remember Me</label>
                  </div>
                  <a [routerLink]="['/forgot-password']" class="link-danger">Forgot Password?</a>
                </div>

                <div class="mb-2">
                  <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Sign In</button>
                </div>

                <div *ngIf="errorMessage" class="alert alert-danger">
                  {{ errorMessage }}
                </div>

                <div class="text-center">
                  <h6 class="fw-normal text-dark mb-0">
                    Don’t have an account? <a routerLink="/register-3" class="hover-a">Create Account</a>
                  </h6>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
