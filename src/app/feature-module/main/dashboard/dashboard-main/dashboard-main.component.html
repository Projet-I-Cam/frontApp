@if (["administration", "regional", "departemental", "arrondissement", "etablissement", "enseignant"].includes(role)) {
  <div class="page-wrapper">
  <div class="content">
    <app-dashboard-head-info></app-dashboard-head-info>
    <app-dashboard-content-info></app-dashboard-content-info>
  </div>
</div>
}
@else if (role === 'parent') {
  <app-parent-dashboard></app-parent-dashboard>
}
@else{
  <app-student-dashboard></app-student-dashboard>
}
