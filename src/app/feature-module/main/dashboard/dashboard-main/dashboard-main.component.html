@if (role === 'etablissement') {
  <app-admin-dashboard></app-admin-dashboard>
}
@else if (role === 'enseignant') {
  <app-teacher-dashboard></app-teacher-dashboard>
}
@else if (role === 'parent') {
  <app-parent-dashboard></app-parent-dashboard>
}
@else if (["administration", "regional", "departemental", "arrondissement"].includes(role)) {
  <app-dashboard-minedub></app-dashboard-minedub>
}
@else{
  <app-student-dashboard></app-student-dashboard>
}
