<!-- Page Wrapper -->
<div class="page-wrapper">
  <div class="content content-two">
    <!-- Page Header -->
    <div
      class="d-md-flex d-block align-items-center justify-content-between mb-3"
    >
      <div class="my-auto mb-2">
        <h3 class="mb-1">Ajouter un personnel</h3>
        <nav>
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
              <a [routerLink] = "routes.adminDashboard">Dashboard</a>
            </li>
            <li class="breadcrumb-item">RH</li>
            <li class="breadcrumb-item active" aria-current="page">
              Ajouter un personnel
            </li>
          </ol>
        </nav>
      </div>
    </div>
    <!-- /Page Header -->

    <div class="row">
      <div class="col-md-12">
        <div class="login-danger" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
        <form [formGroup]="staffForm" (ngSubmit)="onSubmit()">
          <!-- Personal Information -->
          <div class="card">
            <div class="card-header bg-light">
              <div class="d-flex align-items-center">
                <span
                  class="bg-white avatar avatar-sm me-2 text-gray-7 flex-shrink-0"
                >
                  <i class="ti ti-info-square-rounded fs-16"></i>
                </span>
                <h4 class="text-dark">Informations personnelles</h4>
              </div>
            </div>
            <div class="card-body pb-1">
              <div class="add-section">
                <div class="row">
                  <div class="col-md-12">
                    <div
                      class="d-flex align-items-center flex-wrap row-gap-3 mb-3"
                    >
                      <div
                        class="d-flex align-items-center justify-content-center avatar avatar-xxl border border-dashed me-2 flex-shrink-0 text-dark frames"
                      >
                        <i class="ti ti-photo-plus fs-16"></i>
                      </div>
                      <div class="profile-upload">
                        <div class="profile-uploader d-flex align-items-center">
                          <div class="drag-upload-btn mb-3">
                            Upload
                            <input
                              type="file"
                              class="form-control image-sign"
                              multiple=""
                              (change)="onFileSelect($event)"
                              #fileInput
                            />
                          </div>
                          <a
                            href="javascript:void(0);"
                            class="btn btn-primary mb-3"
                            >Remove</a
                          >
                        </div>
                        <p class="fs-12">
                          Upload image size 4MB, Format JPG, PNG, SVG
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Nom<span class="login-danger">*</span></label>
                      <input type="text" class="form-control" formControlName="firstName" [ngClass]="{'is-invalid': staffForm.get('firstName')?.invalid && staffForm.get('firstName')?.touched}" />
                    </div>
                  </div>
                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Prénom<span class="login-danger">*</span></label>
                      <input type="text" class="form-control" formControlName="lastName" [ngClass]="{'is-invalid': staffForm.get('lastName')?.invalid && staffForm.get('lastName')?.touched}" />
                    </div>
                  </div>

                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Date de naissance<span class="login-danger">*</span></label>
                      <div class="input-icon position-relative">
                        <span class="input-icon-addon">
                          <i class="ti ti-calendar"></i>
                        </span>
                        <input
                            type="text"
                            [ngClass]="{'is-invalid': staffForm.get('dateOfBirth')?.invalid && staffForm.get('dateOfBirth')?.touched}"
                            class="form-control datetimepicker"
                            placeholder="jj-mm-aaaa"
                            bsDatepicker
                            formControlName="birthDate"
                          />
                      </div>
                    </div>
                  </div>
                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Lieu de naissance<span class="login-danger">*</span></label>
                      <input type="text" class="form-control" formControlName="birthPlace" [ngClass]="{'is-invalid': staffForm.get('birthPlace')?.invalid && staffForm.get('birthPlace')?.touched}" />
                    </div>
                  </div>
                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Genre<span class="login-danger">*</span></label>
                      <p-dropdown
                          [options]="sexes"
                          placeholder="Sélectionner"
                          class="select"
                          [ngClass]="{'is-invalid': staffForm.get('gender')?.invalid && staffForm.get('gender')?.touched}"
                          formControlName="gender"
                        ></p-dropdown>
                    </div>
                  </div>

                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Situation matrimoniale<span class="login-danger">*</span></label>
                      <p-dropdown
                          [options]="maritalStatuses"
                          placeholder="Sélectionner"
                          class="select"
                          [ngClass]="{'is-invalid': staffForm.get('maritalStatuses')?.invalid && staffForm.get('maritalStatuses')?.touched}"
                          formControlName="maritalStatus"
                        ></p-dropdown>
                    </div>
                  </div>

                  <div class="col-12 col-md-4">
                    <label class="form-label">Nationalité <span class="login-danger">*</span></label>
                    <ng-select
                      [items]="countries"
                      bindLabel="nameFr"
                      formControlName="countryCode"
                      placeholder="Selectionner"
                      [searchable]="true"
                      [clearable]="true">

                      <!-- Template pour l’option dans la liste déroulante -->
                      <ng-template ng-option-tmp let-item="item" let-index="index">
                        <img
                          [src]="item.flag"
                          alt="{{item.nameFr}} drapeau"
                          width="20"
                          height="15"
                          style="margin-right: 8px; vertical-align: middle;">
                        {{ item.nameFr }}
                      </ng-template>

                      <!-- Template pour l’élément sélectionné affiché dans le champ -->
                      <ng-template  ng-label-tmp let-item="item" let-clear="clear">
                        <img
                          [src]="item.flag"
                          *ngIf="item"
                          alt="{{item.nameFr}} drapeau"
                          width="20"
                          height="15"
                          style="margin-right: 8px; vertical-align: middle;">
                        {{ item.nameFr }}
                        <span *ngIf="item" (click)="clear(item)" class="ng-select-clear-button">&times;</span>
                      </ng-template>
                    </ng-select>
                  </div>

                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Arrondissement<span class="login-danger">*</span></label>
                      <p-dropdown
                        formControlName="municipality"
                        [options]="filteredMunicipality"
                        [loading]="loadingMunicipality"
                        [filter]="true"
                        placeholder="Rechercher l'arrondissement"
                        [virtualScroll]="true"
                        [itemSize]="30"
                        (onFilter)="searchMun($event)"
                      >
                      </p-dropdown>
                    </div>
                  </div>
                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Religion</label>
                      <p-dropdown
                        [options]="[
                          { label: 'Select', value: '' },
                          { label: 'christianisme', value: 'Christianisme' },
                          { label: 'musulmane', value: 'Musulmane' }
                        ]"
                        placeholder="Select"
                        class="select"
                      ></p-dropdown>
                    </div>
                  </div>


                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Telephone<span class="login-danger">*</span></label>
                      <input type="text" class="form-control" formControlName="phone" [ngClass]="{'is-invalid': staffForm.get('phone')?.invalid && staffForm.get('phone')?.touched}" />
                    </div>
                  </div>
                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Email</label>
                      <input type="email" class="form-control" formControlName="email" [ngClass]="{'is-invalid': staffForm.get('email')?.invalid && staffForm.get('email')?.touched}" />
                    </div>
                  </div>
                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Address<span class="login-danger">*</span></label>
                      <input type="text" class="form-control" formControlName="address" [ngClass]="{'is-invalid': staffForm.get('address')?.invalid && staffForm.get('address')?.touched}" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- /Personal Information -->

          <!-- Payroll -->
          <div class="card" formGroupName="profesionalBackground">
            <div class="card-header bg-light">
              <div class="d-flex align-items-center">
                <span
                  class="bg-white avatar avatar-sm me-2 text-gray-7 flex-shrink-0"
                >
                  <i class="ti ti-user-shield fs-16"></i>
                </span>
                <h4 class="text-dark">Informations de gestion de carrière</h4>
              </div>
            </div>
            <div class="card-body pb-1">
              <div class="row">
                <div class="col-12 col-md-4">
                  <div class="mb-3">
                    <label class="form-label">Statut<span class="login-danger">*</span></label>
                    <p-dropdown
                      [options]="[
                        { label: 'Fonctionnaire', value: 'Fonctionnaire' },
                        { label: 'Contractuel', value: 'Contractuel' },
                        { label: 'Maître', value: 'maître' }
                      ]"
                      [ngClass]="{'is-invalid': profesionalBackground.get('status')?.invalid && profesionalBackground.get('status')?.touched}"
                      formControlName="status"
                      placeholder="Select"
                      class="select"
                    ></p-dropdown>
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <div class="mb-3">
                    <label class="form-label">Matricule<span class="login-danger">*</span></label>
                    <input type="text" class="form-control" formControlName="registrationNumber" [ngClass]="{'is-invalid': profesionalBackground.get('registrationNumber')?.invalid && profesionalBackground.get('registrationNumber')?.touched}" />
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <div class="mb-3">
                    <label class="form-label">NIU</label>
                    <input type="text" class="form-control" formControlName="NIU" [ngClass]="{'is-invalid': profesionalBackground.get('NIU')?.invalid && profesionalBackground.get('NIU')?.touched}" />
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <div class="mb-3">
                    <label class="form-label">Grade</label>
                    <input type="text" class="form-control" formControlName="grade" [ngClass]="{'is-invalid': profesionalBackground.get('grade')?.invalid && profesionalBackground.get('grade')?.touched}" />
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <div class="mb-3">
                    <label class="form-label">Position actuelle</label>
                    <input type="text" class="form-control" formControlName="currentPosition" [ngClass]="{'is-invalid': profesionalBackground.get('currentPosition')?.invalid && profesionalBackground.get('currentPosition')?.touched}" />
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <div class="mb-3">
                    <label class="form-label">Référence acte de mutation</label>
                    <input type="text" class="form-control" formControlName="mutationActRef" />
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <div class="mb-3">
                    <label class="form-label">Ref acte de nomination</label>
                    <input type="file" class="form-control"
                      (change)="onFileSelect($event, 'refActeIntegration')"
                        #fileInput
                     />
                  </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Date de prise de service<span class="login-danger">*</span></label>
                      <div class="input-icon position-relative">
                        <span class="input-icon-addon">
                          <i class="ti ti-calendar"></i>
                        </span>
                        <input
                            type="text"
                            [ngClass]="{'is-invalid': profesionalBackground.get('startDate')?.invalid && profesionalBackground.get('startDate')?.touched}"
                            class="form-control datetimepicker"
                            placeholder="jj-mm-aaaa"
                            bsDatepicker
                            formControlName="startDate"
                          />
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Date d'entrée a la FP<span class="login-danger">*</span></label>
                      <div class="input-icon position-relative">
                        <span class="input-icon-addon">
                          <i class="ti ti-calendar"></i>
                        </span>
                        <input
                            type="text"
                            [ngClass]="{'is-invalid': profesionalBackground.get('fpStartDate')?.invalid && profesionalBackground.get('fpStartDate')?.touched}"
                            class="form-control datetimepicker"
                            placeholder="jj-mm-aaaa"
                            bsDatepicker
                            formControlName="fpStartDate"
                          />
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-md-4">
                    <div class="mb-3">
                      <label class="form-label">Ref acte d'integration</label>
                      <input type="file" class="form-control"
                        (change)="onFileSelect($event, 'nominationActRef')"
                        #fileInput
                        />
                    </div>
                  </div>
              </div>
            </div>
          </div>
          <!-- /Payroll -->

          <!-- Leaves -->
          <div class="card">
            <div class="card-header bg-light">
              <div class="d-flex align-items-center">
                <span
                  class="bg-white avatar avatar-sm me-2 text-gray-7 flex-shrink-0"
                >
                  <i class="ti ti-users fs-16"></i>
                </span>
                <h4 class="text-dark">Information Professionel</h4>
              </div>
            </div>
            <div class="card-body pb-1">
              <div class="row">
                <div class="col-12 col-md-4">
                  <div class="mb-3">
                    <label class="form-label">Classe en charge<span class="login-danger">*</span></label>
                    <p-dropdown
                        [options]="classrooms"
                        placeholder="Sélectionner"
                        class="select"
                        [ngClass]="{'is-invalid': staffForm.get('classroom')?.invalid && staffForm.get('classroom')?.touched}"
                        formControlName="classroom"
                      ></p-dropdown>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- /Leaves -->
