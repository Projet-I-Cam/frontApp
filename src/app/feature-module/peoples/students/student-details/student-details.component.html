<div class="page-wrapper">
  <div class="content content-two">
    <div class="row" *ngIf="isLoginStudent == false">
      <!-- Page Header -->
      <div class="col-md-12">
        <div class="d-md-flex d-block align-items-center justify-content-between mb-3">
          <div class="my-auto mb-2">
            <h3 class="page-title mb-1">Détail de l'élève : {{studentData?.person?.firstName}} {{studentData?.person?.lastName}}</h3>
            <nav>
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                  <a [routerLink]="routes.adminDashboard">Dashboard</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                  Détail de l'élève
                </li>
              </ol>
            </nav>
          </div>
          <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
            <a class="btn btn-light me-2 mb-2" (click)="goBack()">
              <i class="ti ti-arrow-left me-2"></i>retour</a>
          </div>
        </div>
      </div>
      <!-- /Page Header -->
    </div>
    <div class="col-md-12 text-center" *ngIf="isDataLoading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Chargement...</span>
      </div>
      <p class="mt-2">Chargement des élèves...</p>
    </div>
    <p-tabView [(activeIndex)]="activeIndex" (onChange)="onTabChange($event)" *ngIf="isDataLoading == false">
      <p-tabPanel header="Détails de l'Élève" leftIcon="ti ti-school me-2">
        <app-student-infos [studentData]="studentData.person"></app-student-infos>

      </p-tabPanel>
      <p-tabPanel header="Etablissement" leftIcon="ti ti-table-building me-2">
        <app-student-school [institutionData]="studentData.institution"></app-student-school>
      </p-tabPanel>

      <p-tabPanel header="Emploi du temps" leftIcon="ti ti-table-options me-2">
        <app-student-time-table></app-student-time-table>
      </p-tabPanel>

      <p-tabPanel header="Congés & Présences" leftIcon="ti ti-calendar-due me-2">
        <app-student-leaves></app-student-leaves>
      </p-tabPanel>

      <p-tabPanel header="Frais" leftIcon="ti ti-report-money me-2">
        <app-student-fees></app-student-fees>
      </p-tabPanel>

      <p-tabPanel header="Examens & Résultats" leftIcon="ti ti-bookmark-edit me-2">
        <p-tabView>
          <p-tabPanel header="Resultats au examens">
<!--            <app-student-result></app-student-result>-->
            <app-notes-enfant [studentData]="studentData.person"></app-notes-enfant>
          </p-tabPanel>
          <p-tabPanel *ngIf="!person?.isParent && loginUserRole != 'eleve'" header="Bulletin">
            <app-student-report-card></app-student-report-card>
          </p-tabPanel>
          <p-tabPanel header="LivretScolaire">
            <h4>En cours de développement...</h4>
          </p-tabPanel>
        </p-tabView>
      </p-tabPanel>

      <p-tabPanel header="Devoirs" leftIcon="ti ti-calendar-due me-2">
        <app-student-list-homeworks></app-student-list-homeworks>
      </p-tabPanel>
    </p-tabView>
  </div>
</div>
