<!-- Page Wrapper -->
<div class="page-wrapper">
  <div class="content content-two">
    <!-- Page Header -->
    <div
      class="d-md-flex d-block align-items-center justify-content-between mb-3"
    >
      <div class="my-auto mb-2">
        <h4 class="mb-1">Modifier eleve</h4>
        <nav> 
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
              <a [routerLink] = "routes.adminDashboard">Dashboard</a>
            </li>
            <li class="breadcrumb-item">
              <a [routerLink] = "routes.studentsList">Students</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
              Edit Student
            </li>
          </ol>
        </nav>
      </div>
    </div>
    <!-- /Page Header -->

    <div class="row">
      <div class="col-md-12">
        <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
          <!-- Personal Information -->
          <div class="card">
            <div class="card-header bg-light">
              <div class="d-flex align-items-center">
                <span
                  class="bg-white avatar avatar-sm me-2 text-gray-7 flex-shrink-0"
                >
                  <i class="ti ti-info-square-rounded fs-16"></i>
                </span>
                <h4 class="text-dark">Informations personnelles</h4>
              </div>
            </div>
            <div class="card-body pb-1">
              <div class="row">
                <div class="col-md-12">
                  <div
                    class="d-flex align-items-center flex-wrap row-gap-3 mb-3"
                  >
                    <div
                      class="d-flex align-items-center justify-content-center avatar avatar-xxl border border-dashed me-2 flex-shrink-0 text-dark frames"
                    >
                      <i class="ti ti-photo-plus fs-16"></i>
                    </div>
                    <div class="profile-upload">
                      <div class="profile-uploader d-flex align-items-center">
                        <div class="drag-upload-btn mb-3">
                          Upload
                          <input
                            type="file"
                            class="form-control image-sign"
                            multiple=""
                            #fileInput
                          />
                        </div>
                        <a
                          href="javascript:void(0);"
                          class="btn btn-primary mb-3"
                          >Supprimer</a
                        >
                      </div>
                      <p class="fs-12">
                        Taille de l'image max 4MB, Format JPG, PNG, SVG
                      </p>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row row-cols-xxl-5 row-cols-md-6">
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Année académique</label>
                    <p-dropdown
                      [options]="[
                        { label: 'Juin 2024/25', value: '2024/25' },
                        { label: 'Juin 2023/24', value: '2023/24' },
                        { label: 'Juin 2022/23', value: '2022/23' }
                      ]"
                      placeholder="Sélectionner"
                      class="select"
                      formControlName="academicYear"
                    ></p-dropdown>
                  </div>
                </div>
                <!-- <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Numéro d'admission</label>
                    <input type="text" class="form-control" formControlName="admissionNumber" readonly />
                  </div>
                </div> -->
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Date d'admission <span class="login-danger">*</span></label>
                    <div class="input-icon position-relative">
                      <span class="input-icon-addon">
                        <i class="ti ti-calendar"></i>
                      </span>
                      <input
                          type="text"
                          class="form-control datetimepicker"
                          placeholder="jj-mm-aaaa"
                          bsDatepicker
                          formControlName="admissionDate"
                          [ngClass]="{'is-invalid': studentForm.get('admissionDate')?.invalid && studentForm.get('admissionDate')?.touched}"
                        />
                    </div>
                  </div>
                </div>
                <!-- <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Numéro de rôle</label>
                    <input type="text" class="form-control" formControlName="rollNumber" />
                  </div>
                </div> -->
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Statut <span class="login-danger">*</span></label>
                    <p-dropdown
                        [options]="[
                          { label: 'Actif', value: 'Active' },
                          { label: 'Inactif', value: 'Inactive' }
                        ]"
                        placeholder="Sélectionner"
                        class="select"
                        [ngClass]="{'is-invalid': studentForm.get('status')?.invalid && studentForm.get('status')?.touched}"
                        formControlName="status"
                      ></p-dropdown>
                  </div>
                </div>
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Prénom<span class="login-danger">*</span></label>
                    <input type="text" class="form-control" formControlName="firstName" [ngClass]="{'is-invalid': studentForm.get('firstName')?.invalid && studentForm.get('firstName')?.touched}" />
                  </div>
                </div>
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Nom<span class="login-danger">*</span></label>
                    <input type="text" class="form-control" formControlName="lastName" [ngClass]="{'is-invalid': studentForm.get('lastName')?.invalid && studentForm.get('lastName')?.touched}" />
                  </div>
                </div>
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Classe</label>
                   
                    <p-dropdown
                        [options]="[
                          { label: 'I', value: 'I' },
                          { label: 'II', value: 'II' },
                          { label: 'III', value: 'III' },
                          { label: 'IV', value: 'IV' },
                          { label: 'V', value: 'V' }
                        ]"
                        placeholder="Sélectionner"
                        class="select"
                        formControlName="classroom"
                      ></p-dropdown>
                  </div>
                </div>
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Section<span class="login-danger">*</span></label>
                   
                    <!-- <p-dropdown
                        [options]="sections"
                        placeholder="Sélectionner"
                        class="select"
                        [ngClass]="{'is-invalid': studentForm.get('section')?.invalid && studentForm.get('section')?.touched}"
                        formControlName="section"
                      ></p-dropdown> -->
                  </div>
                </div>
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Genre<span class="login-danger">*</span></label>
                    <!-- <p-dropdown
                        [options]="sexes"
                        placeholder="Sélectionner"
                        class="select"
                        [ngClass]="{'is-invalid': studentForm.get('gender')?.invalid && studentForm.get('gender')?.touched}"
                        formControlName="gender"
                      ></p-dropdown> -->
                  </div>
                </div>
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Date de naissance<span class="login-danger">*</span></label>
                    <div class="input-icon position-relative">
                      <span class="input-icon-addon">
                        <i class="ti ti-calendar"></i>
                      </span>
                      <input
                          type="text"
                          [ngClass]="{'is-invalid': studentForm.get('dateOfBirth')?.invalid && studentForm.get('dateOfBirth')?.touched}"
                          class="form-control datetimepicker"
                          placeholder="jj-mm-aaaa"
                          bsDatepicker
                          formControlName="dateOfBirth"
                        />
                    </div>
                  </div>
                </div>
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Groupe sanguin</label>
                    <select formControlName="bloodGroup" class="form-select">
                      <option value="">Sélectionner</option>
                      <option *ngFor="let bg of bloodGroups" [value]="bg">{{ bg }}</option>
                    </select>
                  </div>
                </div>
                <!-- <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Domicile</label>
                    <p-dropdown
                        [options]="[
                          { label: 'Location', value: 'Rent' },
                          { label: 'Propriétaire', value: 'Own' }
                        ]"
                        placeholder="Sélectionner"
                        class="select"
                        formControlName="house"
                      ></p-dropdown>
                  </div>
                </div> -->
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Religion</label>
                   
                    <p-dropdown
                        [options]="[
                          { label: 'Christianisme', value: 'Christianity' },
                          { label: 'Islam', value: 'Islam' },
                          { label: 'Bouddhisme', value: 'Buddhism' },
                          { label: 'Sans religion', value: 'None' }
                        ]"
                        placeholder="Sélectionner"
                        class="select"
                        formControlName="religion"
                      ></p-dropdown>
                  </div>
                </div>
                <!-- <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Catégorie</label>
                    <p-dropdown
                        [options]="[
                          { label: 'OBC', value: 'OBC' },
                          { label: 'Général', value: 'General' },
                          { label: 'SC', value: 'SC' },
                          { label: 'ST', value: 'ST' }
                        ]"
                        placeholder="Sélectionner"
                        class="select"
                        formControlName="category"
                      ></p-dropdown>
                  </div>
                </div> -->
                <!-- <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Langue maternelle</label>
                    <p-dropdown
                        [options]="[
                          { label: 'Français', value: 'French' },
                          { label: 'Anglais', value: 'English' },
                          { label: 'Espagnol', value: 'Spanish' }
                        ]"
                        placeholder="Sélectionner"
                        class="select"
                        formControlName="language"
                      ></p-dropdown>
                  </div>
                </div> -->
                <div class="col-xxl col-xl-3 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Nationalité</label>
                    <input type="text" class="form-control" formControlName="nationality" />
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- /Personal Information -->

          <!-- Adresse -->
        
          <!-- /Adresse -->

          <!-- Contact Information -->
          <div class="card" >
            <div class="card-header bg-light">
              <div class="d-flex align-items-center">
                <span
                  class="bg-white avatar avatar-sm me-2 text-gray-7 flex-shrink-0"
                >
                  <i class="ti ti-phone fs-16"></i>
                </span>
                <h4 class="text-dark">Informations de contact</h4>
              </div>
            </div>
            <div class="card-body pb-1">
              <div class="row row-cols-xxl-5 row-cols-md-6">
                <div class="col-xxl col-xl-4 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Téléphone<span class="login-danger">*</span></label>
                    <input type="text" class="form-control" formControlName="phoneNumber" [ngClass]="{'is-invalid': studentForm.get('phoneNumber')?.invalid && studentForm.get('phoneNumber')?.touched}" />
                  </div>
                </div>
                <div class="col-xxl col-xl-4 col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" formControlName="email" />
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- /Contact Information -->

          <!-- Academic Information -->

          <!-- /Academic Information -->

          <!-- Medical Information -->

 

          <!-- /Medical Information -->

          <!-- Parent/Guardian Information -->
          <!-- /Parent/Guardian Information -->

          <div class="col-12">
            <div class="student-submit">
              <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- /Page Wrapper -->
