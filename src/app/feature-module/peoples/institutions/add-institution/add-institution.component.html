<div class="page-wrapper">
  <div class="content">
    <div class="page-header">
      <div class="row">
        <div class="col-sm-12">
          <ul class="breadcrumb">
            <li class="breadcrumb-item">
              <a [routerLink]="routes.adminDashboard">Dashboard </a>
            </li>
            <li class="breadcrumb-item"><i class="feather-chevron-right"></i></li>
            <li class="breadcrumb-item">
              <a [routerLink]="'/peoples/institutions/institutions-list'">Institutions</a>
            </li>
            <li class="breadcrumb-item"><i class="feather-chevron-right"></i></li>
            <li class="breadcrumb-item active">{{ pageTitle }}</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-body">
            <div class="row">
              <div class="col-12">
                <div class="form-heading">
                  <h4>{{ pageTitle }}</h4>
                </div>
              </div>
            </div>

            <div *ngIf="loading" class="text-center py-4">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="mt-2">Chargement des données...</p>
            </div>

            <div *ngIf="errorMessage" class="col-12 mb-3">
              <div class="alert alert-danger" role="alert">
                {{ errorMessage }}
              </div>
            </div>

            <div class="col-12" *ngIf="!loading">
              <form [formGroup]="institutionForm" (ngSubmit)="onSubmit()">
                <div class="row">
                  <div class="col-12 col-md-6 col-xl-6">
                    <div class="form-group local-forms">
                      <label>Institution Name <span class="login-danger">*</span></label>
                      <input 
                        type="text" 
                        class="form-control" 
                        placeholder="Enter institution name"
                        formControlName="name"
                        [ngClass]="{'is-invalid': institutionForm.get('name')?.invalid && institutionForm.get('name')?.touched}"
                      >
                      <div class="invalid-feedback" *ngIf="institutionForm.get('name')?.invalid && institutionForm.get('name')?.touched">
                        Institution name is required
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-md-6 col-xl-6">
                    <div class="form-group local-forms">
                      <label>Registration date <span class="login-danger">*</span></label>
                      <div class="input-icon position-relative">
                        <span class="input-icon-addon">
                          <i class="ti ti-calendar"></i>
                        </span> 
                        <input
                            type="text"
                            class="form-control datetimepicker"
                            placeholder="jj-mm-aaaa"
                            bsDatepicker
                            formControlName="registrationDate"
                            [ngClass]="{'is-invalid': institutionForm.get('registrationDate')?.invalid && institutionForm.get('registrationDate')?.touched}"
                          />
                      </div>
                      <div class="invalid-feedback" *ngIf="institutionForm.get('registrationDate')?.invalid && institutionForm.get('registrationDate')?.touched">
                        Registration date is required
                      </div>
                    </div>
                  </div>
                  
                  <div class="col-12 col-md-6 col-xl-6">
                    <div class="form-group local-forms">
                      <label>Municipality <span class="login-danger">*</span></label>
                      <p-dropdown
                        formControlName="municipality"
                        [options]="municipalities"
                        [filter]="true"
                        placeholder="Rechercher le parent"
                        [virtualScroll]="true"
                        [ngClass]="{'is-invalid': institutionForm.get('municipality')?.invalid && institutionForm.get('municipality')?.touched}"
                      >
                      </p-dropdown>

                      <div class="invalid-feedback" *ngIf="institutionForm.get('municipality')?.invalid && institutionForm.get('municipality')?.touched">
                        Municipality is required
                      </div>
                    </div>
                  </div>


                  <div class="col-12 col-md-6 col-xl-6">
                    <div class="form-group local-forms">
                      <label>Address</label>
                      <input 
                        type="address" 
                        class="form-control" 
                        placeholder="Enter the address"
                        formControlName="address"
                      >
                    </div>
                  </div>

                  <!-- <div class="col-12 col-md-6 col-xl-6">
                    <div class="form-group local-forms">
                      <label>Phone Number</label>
                      <input 
                        type="text" 
                        class="form-control" 
                        placeholder="Enter phone number"
                        formControlName="phones"
                      >
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="form-group local-forms">
                      <label>Description</label>
                      <textarea 
                        class="form-control" 
                        rows="4" 
                        placeholder="Enter description of the institution"
                        formControlName="description"
                      ></textarea>
                    </div>
                  </div> -->

                  
                  <div class="col-12 mt-10" >
                    <h4>Person responsible</h4>
                  </div>
                  <div class="col-12" formArrayName="owners">
                    
                    <div style="margin-top: 20px;" *ngFor="let owner of owners.controls; let i = index" [formGroupName]="i">
                      <div class="row col-12" >
                        <div class="row">
                          <div class="col-md-4">
                            <div class="mb-3">
                              <input class="form-check-input" type="checkbox" value="" id="ny" formControlName="LinkExistedParent" >
                              <label for="ny">&nbsp;Link with existing person</label>

                            </div>
                          </div>
                          <div class="row" *ngIf="owner.get('LinkExistedParent')?.value">
                            <div class="col-md-4">
                              <div class="mb-3">
                                <label class="form-label">Find that person</label>
                                <p-dropdown
                                formControlName="ownerId"
                                [options]="filteredPerson"
                                [loading]="loadingDrop"
                                [filter]="true"
                                placeholder="Rechercher le parent"
                                [virtualScroll]="true"
                                [itemSize]="30"
                                (onFilter)="searchParent($event)">
                              </p-dropdown>
                              </div>
                            </div>
                          </div>

                          <div class="row" *ngIf="!owner.get('LinkExistedParent')?.value">
                            <div class="col-12 col-md-6">
                              <div class="mb-3">
                                <label class="form-label">Genre<span class="login-danger">*</span></label>
                                <select 
                                  class="form-select" 
                                  formControlName="gender"
                                  required
                                  [ngClass]="{'is-invalid': owner.get('gender')?.invalid && owner.get('gender')?.touched}"
                                >
                                  <option value="">Sélectionner</option>
                                  <option *ngFor="let type of sexes, let i = index" [value]="type.value">{{type.label}}</option>
                                </select>
                              </div>
                            </div>
                            <div class="col-12 col-md-6 ">
                              <div class="form-group local-forms">
                                <label>Firstname<span class="login-danger">*</span></label>
                                <input 
                                  type="text" 
                                  class="form-control" 
                                  placeholder="Enter Firstname"
                                  formControlName="firstName"
                                  [ngClass]="{'is-invalid': owner.get('firstName')?.invalid && owner.get('firstName')?.touched}"
                                >
                              </div>
                            </div>
                            <div class="col-12 col-md-6 ">
                              <div class="form-group local-forms">
                                <label>Lastname<span class="login-danger">*</span></label>
                                <input 
                                  type="text" 
                                  class="form-control" 
                                  placeholder="Enter the Last name"
                                  formControlName="lastName"
                                  [ngClass]="{'is-invalid': owner.get('lastName')?.invalid && owner.get('lastName')?.touched}"
                                >
                              </div>
                            </div>
                            <div class="col-12 col-md-6 ">
                              <div class="form-group local-forms">
                                <label>Phone<span class="login-danger">*</span></label>
                                <input 
                                  type="text" 
                                  class="form-control" 
                                  placeholder="Enter the phone number"
                                  formControlName="phoneNumber"
                                  [ngClass]="{'is-invalid': owner.get('phones')?.invalid && owner.get('phones')?.touched}"
                                >
                              </div>
                            </div>
                            <div class="col-12 col-md-6">
                              <div class="mb-3">
                                <label class="form-label">Certificate of appointment</label>
                                <input 
                                  type="file" 
                                  class="form-control" 
                                  (change)="onFileSelect($event)"
                                  #fileInput
                                />
                              </div>
                            </div>
                            <div class="col-12 col-md-6">
                              <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" formControlName="email" />
                              </div>
                            </div>
                            <div class="col-12 col-md-6">
                              <div class="mb-3">
                                <label class="form-label">Adresse</label>
                                <input type="text" class="form-control" formControlName="address" />
                              </div>
                            </div>
                          </div>
                        </div>

                      </div>

                    </div>
                  </div>

                  <div class="col-12">
                    <div class="doctor-submit text-end">
                      <button type="button" class="btn btn-secondary me-2" (click)="cancel()">
                        Annuler
                      </button>
                      <button type="submit" class="btn btn-primary" [disabled]="submitting">
                        <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        {{ submitting ? 'Enregistrement...' : (isEditMode ? 'Mettre à jour' : 'Enregistrer') }}
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
