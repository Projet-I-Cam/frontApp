<form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="email-form">
  <label for="name">Nom</label>
  <input id="name" type="text" formControlName="name" required />
  <div *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched" class="error">
    Nom requis
  </div>

  <label for="subject">Sujet</label>
  <input id="subject" type="text" formControlName="subject" required />
  <div *ngIf="contactForm.get('subject')?.invalid && contactForm.get('subject')?.touched" class="error">
    Sujet requis
  </div>

  <label for="email">Email</label>
  <input id="email" type="email" formControlName="email" required />
  <div *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched" class="error">
    Email requis et doit être valide
  </div>

  <label for="message">Message</label>
  <textarea id="message" formControlName="message" required></textarea>
  <div *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched" class="error">
    Message requis
  </div>

  <button type="submit" [disabled]="contactForm.invalid">Envoyer</button>
</form>
